[project]
name = "pagent"
version = "0.1.0"
description = "FastAPI chatbot that connects to the WebUntis MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.116.0",
    "mcp>=1.13.0,<2",
    "openai>=1.50.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]