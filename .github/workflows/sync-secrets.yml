name: Sync Secrets to Azure Key Vault

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-secrets.yml'

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync secrets to Key Vault
        env:
          KV_NAME: pagent-kv-46073
        run: |
          echo "Syncing secrets to Key Vault: $KV_NAME"

          # Add each secret to Key Vault
          az keyvault secret set --vault-name $KV_NAME --name "AZURE-FOUNDRY-API-KEY" --value "${{ secrets.AZURE_FOUNDRY_API_KEY }}"
          az keyvault secret set --vault-name $KV_NAME --name "AZURE-FOUNDRY-ENDPOINT" --value "${{ secrets.AZURE_FOUNDRY_ENDPOINT }}"
          az keyvault secret set --vault-name $KV_NAME --name "AZURE-FOUNDRY-API-VERSION" --value "${{ secrets.AZURE_FOUNDRY_API_VERSION }}"
          az keyvault secret set --vault-name $KV_NAME --name "AZURE-FOUNDRY-MODEL-DEPLOYMENT" --value "${{ secrets.AZURE_FOUNDRY_MODEL_DEPLOYMENT }}"
          az keyvault secret set --vault-name $KV_NAME --name "WEBUNTIS-SERVER" --value "${{ secrets.WEBUNTIS_SERVER }}"
          az keyvault secret set --vault-name $KV_NAME --name "WEBUNTIS-SCHOOL" --value "${{ secrets.WEBUNTIS_SCHOOL }}"
          az keyvault secret set --vault-name $KV_NAME --name "WEBUNTIS-USER" --value "${{ secrets.WEBUNTIS_USER }}"
          az keyvault secret set --vault-name $KV_NAME --name "WEBUNTIS-PASSWORD" --value "${{ secrets.WEBUNTIS_PASSWORD }}"
          az keyvault secret set --vault-name $KV_NAME --name "MCP-COMMAND" --value "${{ secrets.MCP_COMMAND }}"
          az keyvault secret set --vault-name $KV_NAME --name "MCP-ARGS" --value "${{ secrets.MCP_ARGS }}"
          az keyvault secret set --vault-name $KV_NAME --name "MCP-STARTUP-TIMEOUT-SECONDS" --value "${{ secrets.MCP_STARTUP_TIMEOUT_SECONDS }}"
          az keyvault secret set --vault-name $KV_NAME --name "APP-NAME" --value "${{ secrets.APP_NAME }}"

          echo "✓ All secrets synced to Key Vault!"

      - name: Restart Backend Web App
        run: |
          az webapp restart --name pagent-backend --resource-group pagent-rg
          echo "✓ Backend restarted to pick up new secrets"
