name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci-cd.yml'

env:
  ACR_NAME: pagentacr46073
  RESOURCE_GROUP: pagent-rg
  BACKEND_APP_NAME: pagent-backend
  FRONTEND_APP_NAME: pagent-frontend
  BACKEND_IMAGE: pagent-backend
  FRONTEND_IMAGE: pagent-frontend

jobs:
  # Lint and test backend
  backend-quality:
    name: Backend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Lint with ruff
        run: uv run --with ruff ruff check .
        continue-on-error: true

  # Lint and test frontend
  frontend-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://pagent-backend.azurewebsites.net

  # Build and push Docker images
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=https://pagent-backend.azurewebsites.net
            VITE_LOGIN_USERNAME=${{ secrets.VITE_LOGIN_USERNAME }}
            VITE_LOGIN_PASSWORD=${{ secrets.VITE_LOGIN_PASSWORD }}
            VITE_API_KEY=${{ secrets.API_KEY }}
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Azure
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: production
      url: https://pagent-frontend.azurewebsites.net
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Backend Environment Variables
        run: |
          az webapp config appsettings set \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --settings \
              API_KEY="${{ secrets.API_KEY }}" \
              AZURE_FOUNDRY_ENDPOINT="${{ secrets.AZURE_FOUNDRY_ENDPOINT }}" \
              AZURE_FOUNDRY_API_KEY="${{ secrets.AZURE_FOUNDRY_API_KEY }}" \
              AZURE_FOUNDRY_MODEL_DEPLOYMENT="${{ secrets.AZURE_FOUNDRY_MODEL_DEPLOYMENT }}" \
              AZURE_FOUNDRY_API_VERSION="${{ secrets.AZURE_FOUNDRY_API_VERSION }}" \
              WEBUNTIS_SERVER="${{ secrets.WEBUNTIS_SERVER }}" \
              WEBUNTIS_SCHOOL="${{ secrets.WEBUNTIS_SCHOOL }}" \
              WEBUNTIS_USER="${{ secrets.WEBUNTIS_USER }}" \
              WEBUNTIS_PASSWORD="${{ secrets.WEBUNTIS_PASSWORD }}" \
              MCP_COMMAND="/app/.venv/bin/python" \
              MCP_ARGS="-m untis_mcp.server" \
              MCP_STARTUP_TIMEOUT_SECONDS="60"
          echo "✓ Backend environment variables configured (using Docker-installed untis-mcp with 60s timeout)"

      - name: Restart Backend
        run: |
          az webapp restart \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}
          echo "✓ Backend restarted"

      - name: Restart Frontend
        run: |
          az webapp restart \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}
          echo "✓ Frontend restarted"

      - name: Wait for services to be healthy
        run: |
          echo "Waiting 60 seconds for services to start..."
          sleep 60

      - name: Health Check - Backend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://pagent-backend.azurewebsites.net/health)
          if [ "$response" = "200" ]; then
            echo "✓ Backend is healthy (HTTP $response)"
          else
            echo "✗ Backend health check failed (HTTP $response)"
            exit 1
          fi

      - name: Health Check - Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://pagent-frontend.azurewebsites.net/)
          if [ "$response" = "200" ]; then
            echo "✓ Frontend is healthy (HTTP $response)"
          else
            echo "✗ Frontend health check failed (HTTP $response)"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: https://pagent-backend.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://pagent-frontend.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed**: $(date -u)" >> $GITHUB_STEP_SUMMARY
